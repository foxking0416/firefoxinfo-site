<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="動態匯費設定">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f77f00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f77f00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg)"/>
  <rect width="600" height="360" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#2a2a2a" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- step chart: $10 → $5 → $0 -->
  <g transform="translate(90, 100)">
    <!-- baseline (time axis) -->
    <line x1="0" y1="110" x2="420" y2="110" stroke="#555" stroke-width="1.5"/>

    <!-- step 1: $10 (tallest) -->
    <rect x="0" y="20" width="140" height="90" fill="#f77f00" opacity="0.85"/>
    <text x="70" y="10" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#f77f00" text-anchor="middle">$10</text>

    <!-- step 2: $5 (medium) -->
    <rect x="140" y="65" width="140" height="45" fill="#f77f00" opacity="0.7"/>
    <text x="210" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#f77f00" text-anchor="middle">$5</text>

    <!-- step 3: $0 -->
    <rect x="280" y="105" width="140" height="5" fill="#f77f00" opacity="0.55"/>
    <text x="350" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#f77f00" text-anchor="middle">$0</text>

    <!-- vertical dividers (breakpoints) -->
    <line x1="140" y1="0" x2="140" y2="130" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
    <line x1="280" y1="0" x2="280" y2="130" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- time labels -->
    <text x="140" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#aaaaaa" text-anchor="middle">2022-09</text>
    <text x="280" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#aaaaaa" text-anchor="middle">2026-09</text>
  </g>

  <!-- title -->
  <text x="300" y="300" font-family="'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', 'Noto Sans TC', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">動態匯費設定</text>
  <line x1="265" y1="316" x2="335" y2="316" stroke="#f77f00" stroke-width="3" stroke-linecap="round"/>
  <text x="300" y="342" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#888888" text-anchor="middle" letter-spacing="4">DYNAMIC  ·  FEE  ·  SETTING</text>
</svg>
