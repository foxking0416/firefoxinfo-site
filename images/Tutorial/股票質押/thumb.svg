<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="股票質押記帳">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f77f00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f77f00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg)"/>
  <rect width="600" height="360" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#2a2a2a" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <g font-family="'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', 'Noto Sans TC', sans-serif">
    <!-- 擔保品：三張股票卡片 -->
    <g transform="translate(120, 70)">
      <rect x="16" y="0" width="120" height="76" rx="6" fill="rgba(255,255,255,0.05)" stroke="#5a5a5a" stroke-width="1.2"/>
      <rect x="8" y="10" width="120" height="76" rx="6" fill="rgba(255,255,255,0.07)" stroke="#6a6a6a" stroke-width="1.2"/>
      <rect x="0" y="20" width="120" height="76" rx="6" fill="rgba(247,127,0,0.16)" stroke="#f77f00" stroke-width="1.5"/>
      <text x="60" y="55" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">擔保品</text>
      <text x="60" y="78" font-size="12" fill="#bbbbbb" text-anchor="middle">撥券</text>
    </g>
    <!-- arrow -->
    <path d="M 262 128 L 330 128" stroke="#f77f00" stroke-width="2.5" fill="none"/>
    <path d="M 324 121 L 333 128 L 324 135" stroke="#f77f00" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <!-- 借款 -->
    <g transform="translate(345, 90)">
      <rect x="0" y="0" width="130" height="76" rx="6" fill="rgba(255,255,255,0.06)" stroke="#8a8a8a" stroke-width="1.2"/>
      <text x="65" y="33" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">借款</text>
      <text x="65" y="56" font-size="12" fill="#bbbbbb" text-anchor="middle">整戶維持率</text>
    </g>
  </g>

  <!-- title -->
  <text x="300" y="290" font-family="'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', 'Noto Sans TC', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">股票質押記帳</text>
  <line x1="265" y1="306" x2="335" y2="306" stroke="#f77f00" stroke-width="3" stroke-linecap="round"/>
  <text x="300" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#888888" text-anchor="middle" letter-spacing="4">COLLATERAL  ·  LOAN  ·  RATIO</text>
</svg>
