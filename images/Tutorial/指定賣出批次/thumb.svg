<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="指定賣出批次">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f77f00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f77f00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg)"/>
  <rect width="600" height="360" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#2a2a2a" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Batch rows -->
  <g transform="translate(120, 55)" font-family="'Segoe UI', Arial, sans-serif">
    <!-- Row 1: highlighted (picked to sell) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="360" height="34" rx="4" fill="rgba(247,127,0,0.16)" stroke="#f77f00" stroke-width="1.5"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#ffffff">2023-08-01</text>
      <text x="170" y="23" font-size="15" font-weight="600" fill="#ffffff">@ $18.32</text>
      <!-- target icon -->
      <circle cx="325" cy="17" r="10" fill="none" stroke="#f77f00" stroke-width="2"/>
      <circle cx="325" cy="17" r="5" fill="#f77f00"/>
    </g>
    <!-- Row 2: normal -->
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="360" height="34" rx="4" fill="rgba(255,255,255,0.04)"/>
      <text x="18" y="23" font-size="15" fill="#8a8a8a">2023-10-02</text>
      <text x="170" y="23" font-size="15" fill="#8a8a8a">@ $17.90</text>
    </g>
    <!-- Row 3: highlighted -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="360" height="34" rx="4" fill="rgba(247,127,0,0.16)" stroke="#f77f00" stroke-width="1.5"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#ffffff">2024-01-02</text>
      <text x="170" y="23" font-size="15" font-weight="600" fill="#ffffff">@ $18.04</text>
      <circle cx="325" cy="17" r="10" fill="none" stroke="#f77f00" stroke-width="2"/>
      <circle cx="325" cy="17" r="5" fill="#f77f00"/>
    </g>
    <!-- Row 4: normal -->
    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="360" height="34" rx="4" fill="rgba(255,255,255,0.04)"/>
      <text x="18" y="23" font-size="15" fill="#8a8a8a">2024-03-15</text>
      <text x="170" y="23" font-size="15" fill="#8a8a8a">@ $18.05</text>
    </g>
  </g>

  <!-- title -->
  <text x="300" y="290" font-family="'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', 'Noto Sans TC', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">指定賣出批次</text>
  <line x1="265" y1="306" x2="335" y2="306" stroke="#f77f00" stroke-width="3" stroke-linecap="round"/>
  <text x="300" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#888888" text-anchor="middle" letter-spacing="4">SPECIFY  ·  SELL  ·  LOTS</text>
</svg>
