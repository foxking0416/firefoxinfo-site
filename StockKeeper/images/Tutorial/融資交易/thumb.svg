<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="融資交易記帳">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f77f00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f77f00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg)"/>
  <rect width="600" height="360" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#2a2a2a" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- 槓桿：自備款 + 融資 堆疊長條 -->
  <g transform="translate(150, 50)" font-family="'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', 'Noto Sans TC', sans-serif">
    <!-- 自備款 -->
    <rect x="0" y="120" width="70" height="70" rx="4" fill="rgba(255,255,255,0.08)" stroke="#8a8a8a" stroke-width="1.2"/>
    <text x="35" y="160" font-size="14" fill="#bbbbbb" text-anchor="middle">自備款</text>
    <!-- 自備款 + 融資 -->
    <rect x="110" y="120" width="70" height="70" rx="4" fill="rgba(255,255,255,0.08)" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="110" y="20" width="70" height="100" rx="4" fill="rgba(247,127,0,0.20)" stroke="#f77f00" stroke-width="1.5"/>
    <text x="145" y="75" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">融資</text>
    <!-- arrow -->
    <path d="M 78 150 L 102 150" stroke="#f77f00" stroke-width="2.5" fill="none"/>
    <path d="M 96 144 L 104 150 L 96 156" stroke="#f77f00" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <!-- 維持率 gauge -->
    <g transform="translate(250, 105)">
      <path d="M -45 0 A 45 45 0 0 1 45 0" fill="none" stroke="#3a3a3a" stroke-width="10" stroke-linecap="round"/>
      <path d="M -45 0 A 45 45 0 0 1 31 -32" fill="none" stroke="#f77f00" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="26" y2="-26" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
      <text x="0" y="30" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">維持率</text>
    </g>
  </g>

  <!-- title -->
  <text x="300" y="290" font-family="'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', 'Noto Sans TC', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">融資交易記帳</text>
  <line x1="265" y1="306" x2="335" y2="306" stroke="#f77f00" stroke-width="3" stroke-linecap="round"/>
  <text x="300" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#888888" text-anchor="middle" letter-spacing="4">MARGIN  ·  INTEREST  ·  RATIO</text>
</svg>
